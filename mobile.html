<style>
:root{
  color-scheme: light;

  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --neutral:#a3a29c; --neutral2:#cfcec8;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b; --critical-bg:rgba(208,59,59,.07);
  --pos:#2a78d6; --neg:#e34948;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);

@media (prefers-color-scheme: dark){

    color-scheme: dark;
    --bg:#121211; --surface:#1a1a19; --panel:#1f1f1e; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e88;

    --neutral:#6f6e69; --neutral2:#4a4a46; --critical-bg:rgba(230,103,103,.10); --pos:#3987e5; --neg:#e66767;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}

.wf .it{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--grid);font-size:14px}

<body>
<div class="app">
  <header>
    <div class="row"><h1 id="hTitle">생애 수지 진단</h1><span class="stepno" id="stepNo"></span><a class="hbtn" href="index.html" style="text-decoration:none">PC</a><button class="hbtn" id="btnMenu">결과</button></div>
    <div class="prog"><i id="progBar"></i></div>
  </header>
  <div id="steps"></div>
</div>
<nav class="bot"><div class="in"><button class="btn sec" id="bPrev">이전</button><button class="btn pri" id="bNext">다음</button></div></nav>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ↓ PC 버전과 동일한 계산 엔진 */
/* =====================================================================
   1. 기준 데이터 (2026년)
   ===================================================================== */
const BASE = {
  year: 2026,
  A: 319.3511,            // 국민연금 A값 (만원/월)
  Bmax: 637, Bmin: 40,    // 기준소득월액 상한·하한 (만원)
  depSpouse: 30.663,      // 부양가족연금 배우자 (만원/년)
  depChild: 20.436,       // 부양가족연금 자녀 (만원/년)
  lifeM: [[30,51.5],[35,46.7],[40,41.9],[45,37.2],[50,32.5],[55,28.1],[60,23.7],[65,19.5],[75,11.8]],
  lifeF: [[30,57.1],[35,52.3],[40,47.4],[45,42.6],[50,37.8],[55,33.1],[60,28.4],[65,23.7],[75,14.9]],
  edu: [ {from:5,to:6,amt:423.6,label:'유치원'}, {from:7,to:12,amt:519.6,label:'초등'},
         {from:13,to:15,amt:553.2,label:'중학교'}, {from:16,to:18,amt:598.8,label:'고등학교'},
         {from:19,to:22,amt:727.03,label:'대학'} ],
  wed: { M:{amt:22635, age:34}, F:{amt:15478, age:32} }   // 듀오 2026 결혼비용 보고서 부담 추정액(주택 포함)
};

/* =====================================================================
   2. 기본 입력값 (엑셀 예시 고객과 동일 · 2026년 기준으로 이동)
   ===================================================================== */
const DEFAULT = {
  meta:{ client:'홍길동', date:'2026-11', counselor:'' },
  self:{ gender:'M', age:45, income:5000, retire:55, severance:0, npsStart:2014, npsB:0, npsOverride:0 },
  spouse:{ has:true, name:'김영희', gender:'F', age:43, income:0, retire:55, severance:0, npsStart:0, npsB:0, npsOverride:0 },
  children:[ {name:'홍명수', gender:'M', age:13}, {name:'홍선희', gender:'F', age:7} ],
  edu:{ ratio:50 }, wed:{ ratio:100 },
  living:{ monthly:260, retireRatio:70, singleRatio:70, fixedMonthly:0, fixedEndAge:65 },
  house:{ loan:15000, rate:4.0, maturity:2029, method:'bullet', other:0, otherRate:5.0, otherMaturity:2030, plan:0, planAge:0 },
  leisure:[ {name:'국내여행', amt:100, start:55, years:10, cycle:3}, {name:'해외여행', amt:500, start:56, years:10, cycle:1} ],
  assets:{ financial:20000, realestate:0, sellAge:0, otherIncome:200, otherEnd:2028 },
  pp:{ balance:0, monthly:0, endAge:0, start:60, years:20 },
  life:{ mode:'table', selfEnd:90, spouseEnd:92 },
  assume:{ rate:3.0, cpi:2.5, edu:3.0, wage:3.5, pp:3.0 },
  rd:{ retireDelay:0, reEmpIncome:3000, reEmpYears:5, spouseIncome:0, spouseYears:0, livingCut:0, retireRatio:70,
       eduRatio:50, wedRatio:70, leisurePct:70, cashOut:0, cashOutAge:0, npsShift:0,
       addPP:0, addPPYears:10, addPPStart:65, addPPPayYears:20 }
};
const clone = o => JSON.parse(JSON.stringify(o));
let S = clone(DEFAULT);
const STORE_KEY = 'lifecycle-analysis-v1';
try { const raw = localStorage.getItem(STORE_KEY); if (raw) S = mergeDeep(clone(DEFAULT), JSON.parse(raw)); } catch(e) {}
function mergeDeep(t, s){ for (const k in s){ if (s[k] && typeof s[k]==='object' && !Array.isArray(s[k]) && t[k] && typeof t[k]==='object') mergeDeep(t[k], s[k]); else t[k]=s[k]; } return t; }

/* =====================================================================
   3. 계산 엔진
   ===================================================================== */
function lifeExp(age, g){
  const T = g==='F' ? BASE.lifeF : BASE.lifeM;
  if (age <= T[0][0]) return T[0][1] + (T[0][0]-age);
  const last = T[T.length-1];
  if (age >= last[0]) return Math.max(3, last[1] - (g==='F'?0.8:0.7)*(age-last[0]));
  for (let i=0;i<T.length-1;i++){ const [a,ea]=T[i],[b,eb]=T[i+1]; if (age>=a && age<=b) return ea+(eb-ea)*(age-a)/(b-a); }
}
function npsBaseAge(birthYear){
  if (birthYear<=1952) return 60; if (birthYear<=1956) return 61; if (birthYear<=1960) return 62;
  if (birthYear<=1964) return 63; if (birthYear<=1968) return 64; return 65;
}
function kOf(y){ if (y<1999) return 2.4; if (y<=2007) return 1.8; if (y===2008) return 1.5; if (y<=2025) return 1.5-0.015*(y-2008); return 1.29; }
// 국민연금 (현재가치, 만원/년) + 가입연수
function npsCalc(p, retireAge, shift){
  const out = { annual:0, years:0, startAge: npsBaseAge(BASE.year-p.age)+shift, eligible:false };
  const mult = shift>0 ? 1+0.072*shift : 1+0.06*shift;
  if (p.npsOverride>0){ out.annual = p.npsOverride*12*mult; out.years=20; out.eligible=true; return out; }
  if (!p.npsStart) return out;
  const endYear = BASE.year + (Math.min(retireAge,60) - 1 - p.age);
  const n = endYear - p.npsStart + 1;
  out.years = Math.max(0,n);
  if (n < 10) return out;
  let ks=0; for (let y=p.npsStart;y<=endYear;y++) ks+=kOf(y);
  const K = ks/n;
  const B = Math.min(BASE.Bmax, Math.max(BASE.Bmin, p.npsB>0 ? p.npsB : (p.income>0 ? p.income/12 : BASE.Bmin)));
  out.annual = K*(BASE.A+B)*(1+0.05*Math.max(0,n-20))*Math.min(1,n/20)*mult;
  out.eligible = true;
  return out;
}
function survivorRate(years){ return years>=20 ? 0.6 : years>=10 ? 0.5 : 0.4; }

function neutralRd(s){
  return { retireDelay:0, reEmpIncome:0, reEmpYears:0, spouseIncome:0, spouseYears:0, livingCut:0,
    retireRatio:s.living.retireRatio, eduRatio:s.edu.ratio, wedRatio:s.wed.ratio, leisurePct:100,
    cashOut:0, cashOutAge:0, npsShift:0, addPP:0, addPPYears:0, addPPStart:65, addPPPayYears:20 };
}
const n0 = v => (isFinite(+v) ? +v : 0);

function compute(s, rd){
  const Y0 = BASE.year, a = s.assume;
  const r = n0(a.rate)/100, cpi = n0(a.cpi)/100, er = n0(a.edu)/100, wg = n0(a.wage)/100, ppr = n0(a.pp)/100;
  const me = s.self, sp = s.spouse, hasSp = !!sp.has;
  const retS = n0(me.retire) + n0(rd.retireDelay), retP = n0(sp.retire);
  const endS = s.life.mode==='manual' ? n0(s.life.selfEnd) : Math.round(me.age + lifeExp(me.age, me.gender));
  const endP = !hasSp ? -1 : (s.life.mode==='manual' ? n0(s.life.spouseEnd) : Math.round(sp.age + lifeExp(sp.age, sp.gender)));
  const npsS = npsCalc(me, retS, n0(rd.npsShift));
  const npsP = hasSp ? npsCalc(sp, retP, 0) : {annual:0,years:0,startAge:99,eligible:false};
  const loanPay = (P, rate, mat) => { const n = mat - Y0 + 1; if (P<=0 || n<=0) return 0; const i=rate/100; return i===0 ? P/n : P*i/(1-Math.pow(1+i,-n)); };
  const hPay = loanPay(n0(s.house.loan), n0(s.house.rate), n0(s.house.maturity));
  const oPay = loanPay(n0(s.house.other), n0(s.house.otherRate), n0(s.house.otherMaturity));
  const rows = [];
  let bal = n0(s.assets.financial);
  const pots = [
    { who:'S', pot:n0(s.pp.balance), monthly:n0(s.pp.monthly), payUntilAge: n0(s.pp.endAge), start:n0(s.pp.start), years:n0(s.pp.years), pay:null, left:0 },
    { who:'S', pot:0, monthly:n0(rd.addPP), payUntilAge: me.age + n0(rd.addPPYears), start:n0(rd.addPPStart), years:n0(rd.addPPPayYears), pay:null, left:0 }
  ];
  for (let y=0; y<90; y++){
    const year = Y0+y, aS = me.age+y, aP = hasSp ? sp.age+y : null;
    const aliveS = aS <= endS, aliveP = hasSp && aP <= endP;
    if (!aliveS && !aliveP) break;
    const infl = Math.pow(1+cpi,y), wf = Math.pow(1+wg,y), ef = Math.pow(1+er,y);
    const ev = [];
    const R = { y, year, aS, aP, aliveS, aliveP,
      work:0, other:0, pension:0, npsS:0, npsP:0, ppay:0, reemp:0,
      living:0, kids:0, edu:0, wed:0, housing:0, leisure:0, saving:0, interest:0 };
    // ---- 수입
    if (aliveS && aS < retS) R.work += n0(me.income)*wf;
    if (aliveP && aP < retP) R.work += n0(sp.income)*wf;
    if (aliveP && y < n0(rd.spouseYears)) R.work += n0(rd.spouseIncome)*wf;
    if (aliveS && aS >= retS && aS < retS + n0(rd.reEmpYears)) { R.reemp = n0(rd.reEmpIncome)*infl; R.work += R.reemp; }
    if (aliveS && aS === retS) { R.other += n0(me.severance)*wf; ev.push('본인 은퇴'); }
    if (aliveP && aP === retP) { R.other += n0(sp.severance)*wf; ev.push('배우자 은퇴'); }
    if (year <= n0(s.assets.otherEnd)) R.other += n0(s.assets.otherIncome);
    if (n0(s.assets.sellAge)>0 && aS === n0(s.assets.sellAge)) { R.other += n0(s.assets.realestate)*infl; ev.push('부동산 현금화'); }
    if (n0(rd.cashOut)>0 && aS === n0(rd.cashOutAge)) { R.other += n0(rd.cashOut)*infl; ev.push('주택 다운사이징'); }
    // 국민연금 (+ 부양가족, 유족)
    const sRecv = npsS.eligible && aS >= npsS.startAge, pRecv = npsP.eligible && aP !== null && aP >= npsP.startAge;
    if (aliveS && sRecv) {
      R.npsS = npsS.annual*infl;
      if (aliveP && !npsP.eligible) R.npsS += BASE.depSpouse*infl;
      s.children.forEach(c => { if (c.age + y < 19) R.npsS += BASE.depChild*infl; });
    }
    if (aliveP && pRecv) R.npsP = npsP.annual*infl;
    if (!aliveS && aliveP && npsS.eligible && aS >= npsS.startAge - 0) {
      const surv = npsS.annual*survivorRate(npsS.years)*infl;
      R.npsP = pRecv ? Math.max(surv, R.npsP + surv*0.3) : surv;
    }
    if (aliveS && !aliveP && hasSp && npsP.eligible && aP >= npsP.startAge) {
      const surv = npsP.annual*survivorRate(npsP.years)*infl;
      R.npsS = sRecv ? Math.max(surv, npsS.annual*infl + surv*0.3) : surv;
    }
    if (aS === npsS.startAge && npsS.eligible) ev.push('본인 국민연금 개시');
    if (hasSp && aP === npsP.startAge && npsP.eligible) ev.push('배우자 국민연금 개시');
    // 개인연금
    pots.forEach(p => {
      if (p.monthly>0 && aS < p.payUntilAge && aS < p.start) { R.saving += p.monthly*12; p.pot = p.pot*(1+ppr) + p.monthly*12; }
      else if (p.pay===null) p.pot = p.pot*(1+ppr);
      if (aS === p.start && p.pot > 0){
        const n = p.years>0 ? p.years : Math.max(1, endS - p.start + 1);
        p.pay = ppr===0 ? p.pot/n : p.pot*ppr/(1-Math.pow(1+ppr,-n)); p.left = n;
      }
      if (p.pay && p.left>0 && aliveS){ R.ppay += p.pay; p.left--; }
    });
    R.pension = R.npsS + R.npsP + R.ppay;
    // ---- 지출
    const retired = aliveS ? aS >= retS : aP >= retP;
    const monthly = Math.max(0, n0(s.living.monthly) - n0(rd.livingCut));
    let liv = monthly*12*(retired ? n0(rd.retireRatio)/100 : 1);
    if (hasSp && (aliveS !== aliveP)) liv *= n0(s.living.singleRatio)/100;
    R.living = liv*infl;
    if (aliveS && aS < n0(s.living.fixedEndAge)) R.saving += n0(s.living.fixedMonthly)*12*infl;
    s.children.forEach(c => {
      const ca = c.age + y;
      const st = BASE.edu.find(e => ca>=e.from && ca<=e.to);
      if (st) R.edu += st.amt*n0(rd.eduRatio)/100*ef;
      const w = BASE.wed[c.gender==='F'?'F':'M'];
      if (c.age < w.age && ca === w.age){ R.wed += w.amt*n0(rd.wedRatio)/100*infl; ev.push(`${c.name||'자녀'} 결혼`); }
      if (ca === 19 && c.age < 19) ev.push(`${c.name||'자녀'} 대학 입학`);
    });
    R.kids = R.edu + R.wed;
    if (year <= n0(s.house.maturity) && n0(s.house.loan)>0){
      if (s.house.method==='bullet'){ R.housing += n0(s.house.loan)*n0(s.house.rate)/100; if (year===n0(s.house.maturity)){ R.housing += n0(s.house.loan); ev.push('주택대출 만기'); } }
      else R.housing += hPay;
    }
    if (year <= n0(s.house.otherMaturity) && n0(s.house.other)>0) R.housing += oPay;
    if (n0(s.house.plan)>0 && aS === n0(s.house.planAge)){ R.housing += n0(s.house.plan)*infl; ev.push('주택 구입·확장'); }
    s.leisure.forEach(l => {
      const st=n0(l.start), yrs=n0(l.years), cy=Math.max(1,n0(l.cycle));
      if (aS>=st && aS<st+yrs && (aS-st)%cy===0) R.leisure += n0(l.amt)*n0(rd.leisurePct)/100*infl;
    });
    if (aS === endS) ev.push('본인 기대여명');
    if (hasSp && aP === endP) ev.push('배우자 기대여명');
    // ---- 합계와 잔고
    R.inc = R.work + R.other + R.pension;
    R.exp = R.living + R.kids + R.housing + R.leisure + R.saving;
    R.interest = bal > 0 ? bal*r : 0;
    R.net = R.inc - R.exp;
    bal = bal + R.interest + R.net;
    R.bal = bal; R.infl = infl; R.ev = ev;
    rows.push(R);

  // ---- 요약
  const sum = k => rows.reduce((t,x)=>t+x[k],0);
  const sumPV = k => rows.reduce((t,x)=>t+x[k]/x.infl,0);

  const T = {}, TP = {};
  keys.forEach(k => { T[k]=sum(k); TP[k]=sumPV(k); });
  const livPre = rows.filter(x=>x.aliveS ? x.aS<retS : x.aP<retP);
  T.livingPre = livPre.reduce((t,x)=>t+x.living,0); TP.livingPre = livPre.reduce((t,x)=>t+x.living/x.infl,0);
  T.livingPost = T.living - T.livingPre; TP.livingPost = TP.living - TP.livingPre;
  T.assets = TP.assets = n0(s.assets.financial);
  const neg = rows.find(x => x.bal < 0);
  const last = rows[rows.length-1];
  // 노후 월 점검: 본인 국민연금 개시 연령 (없으면 은퇴 다음 해)
  const chkAge = npsS.eligible ? Math.max(npsS.startAge, retS) : retS;
  const chk = rows.find(x => x.aS === chkAge) || last;
  const gapYears = Math.max(0, (npsS.eligible ? npsS.startAge : (endS+1)) - retS - n0(rd.reEmpYears));
  return { rows, T, TP, retS, retP, endS, endP, npsS, npsP, hasSp,
    depletion: neg ? { year:neg.year, age:neg.aS, ageP:neg.aP } : null,
    endBal: last.bal, endBalPV: last.bal/last.infl, last, chk, chkAge, gapYears };
}

document.addEventListener('change', e => { if (e.target.id==='jsonFile'){ const f=e.target.files[0]; if(!f) return;

/* ---------- 공유 · 보관 ---------- */
async function copyText(t, msg){ try { await navigator.clipboard.writeText(t); toast(msg); } catch(e){ const ta=$('#pasteBox'); if (ta){ ta.value=t; ta.closest('details').open=true; ta.select(); } toast('자동 복사가 막혀 있어 아래 상자에 넣었습니다. 길게 눌러 복사하세요.'); } }
function copySummary(){
  const b=RES.base, r=RES.rd, name=S.meta.client?`${S.meta.client} 선생님`:'선생님', c=r.chk, f=1/c.infl/12;
  const lines=[`[${name} 생애 수지 진단 요약]`, `· ${b.depletion?`현재 계획: ${b.depletion.age}세(${b.depletion.year}년)부터 자금 부족`:'현재 계획: 기대여명까지 자금 유지'}`];
  if (Math.abs(endB(r)-endB(b))>=1) lines.push(`· 재설계안: ${r.depletion?`${r.depletion.age}세부터 부족`:'기대여명까지 자금 유지'} (종료 시점 잔고 ${endB(r)>=endB(b)?'+':'−'}${man(Math.abs(endB(r)-endB(b)))})`);
  lines.push(`· 생애 필요자금 ${man(tt(r,'exp'))} / 준비자금 ${man(tt(r,'inc')+r.T.assets)}`);
  lines.push(`· 노후 월 생활비 ${fmt(c.living*f)}만원, 월 소득 ${fmt(c.inc*f)}만원 (${r.chkAge}세, 현재가치)`);
  if (r.npsS.eligible) lines.push(`· 국민연금 예상 월 ${fmt(r.npsS.annual/12)}만원 (${r.npsS.startAge}세부터)`);
  if (r.gapYears>0) lines.push(`· 은퇴 후 소득 공백기 ${r.gapYears}년 대비 필요`);
  lines.push('※ 통계 평균과 입력값에 근거한 추정치입니다.');
  copyText(lines.join('\n'), '진단 요약을 복사했습니다. 문자·카톡에 붙여넣으세요.');
}
document.addEventListener('click', e => {

  if (id==='newForm'){ S = clone(DEFAULT); S.meta={client:'',date:'2026-11',counselor:''}; S.children=[]; S.leisure=[];

    S.house.loan=0; S.assets.financial=0; S.assets.otherIncome=0; S.living.monthly=250; S.rd=neutralRd(S); save(); go(0); toast('새 양식을 열었습니다.'); }
});
